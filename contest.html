<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" sizes="64x64" href="image/logo-Youtube.png">
  <link rel="icon" type="image/png" sizes="32x32" href="image/logo-Youtube.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="theme.js"></script>
  <title>Envoyer une demande</title>
</head>
<body>
  <header>
    <nav>
      <div class="menu-toggle" id="menu-toggle">
        ☰
      </div>

      <ul id="menu-list">
        <a href="index.html"><img src="image/logo-Youtube.png" alt="logo-Youtube" class="logo-Youtube"></a>
        <div class="buttons-nav">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="contest.html">Contestation</a></li>
        <li><a href="reseaux.html">Mes réseaux</a></li>
        </div>
        <button id="toggle-theme">🌙</button>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Demande de recours</h1>

    <form id="appeal-form">
  <p>
    <label for="platform">Plateforme concernée</label><br>
    <select id="platform" name="platform" required>
      <option value="">Choisir une plateforme</option>
      <option value="Discord">Discord</option>
      <option value="Twitch">Twitch</option>
      <option value="Youtube">Youtube</option>
    </select>
  </p>

  <p>
    <label for="accountName">Nom ou identifiant du compte</label><br>
    <input
      id="accountName"
      name="accountName"
      maxlength="100"
      required
    >
  </p>

  <p>
    <label for="reason">Motif de la demande</label><br>
    <textarea
      id="reason"
      name="reason"
      maxlength="3000"
      required
    ></textarea>
  </p>

  <button type="submit">Envoyer la demande</button>
</form>

<p id="status" role="status"></p>
  </main>
  <footer>
    <p>Made by <span class="accentuated">enderlink178576</span></p>
    <p>©2026</p>
  </footer>
  <script>
    const form = document.querySelector("#appeal-form");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Envoi en cours…";

      const formData = new FormData(form);

      try {
        const response = await fetch("/api/appeals", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            platform: formData.get("platform"),
            accountName: formData.get("accountName"),
            reason: formData.get("reason")
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "L'envoi a échoué.");
        }

        status.textContent = "Demande envoyée.";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "Une erreur est survenue.";
      }
});
  </script>
  <style>
    .choix {
      position: relative;
      display: inline-block;
    }

    #options {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 100%;
      background: white;
      border: 1px solid #ccc;
    }

    #options button {
      display: block;
      width: 100%;
      padding: 10px;
      border: 0;
      background: white;
      text-align: left;
      cursor: pointer;
    }

    #options button:hover {
      background: #eee;
    }
  </style>

</body>
</html>
