<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Envoyer une demande</title>
</head>
<body>
  <h1>Demande de recours</h1>

  <form id="appeal-form">
    <p>
      <label for="discordName">Nom ou identifiant Discord</label><br>
      <input id="discordName" name="discordName" maxlength="100" required>
    </p>

    <p>
      <label for="reason">Motif de la demande</label><br>
      <textarea id="reason" name="reason" maxlength="3000" required></textarea>
    </p>

    <button type="submit">Envoyer la demande</button>
  </form>

  <p id="status" role="status"></p>

  <script>
    const form = document.querySelector("#appeal-form");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const discordName = document.querySelector("#discordName").value.trim();
      const reason = document.querySelector("#reason").value.trim();

      status.textContent = "Envoi en cours…";

      try {
        const response = await fetch("/api/appeals", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ discordName, reason })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "L'envoi a échoué.");
        }

        status.textContent = "Demande envoyée avec succès.";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "Impossible d'envoyer la demande.";
      }
    });
  </script>
</body>
</html>
